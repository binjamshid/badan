name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-contracts:
    name: Validate shared data contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history + tags), not the default shallow/no-tags checkout —
          # "Android port guard scripts are wired and self-test" below needs the
          # `android-port-scaffold` tag to be resolvable once Batch 1 of the Android parity port
          # cuts it (see scripts/check_frozen_files.sh). A shallow checkout would make that tag
          # invisible to this job even after it exists, and the frozen-file gate would silently
          # stay a no-op forever instead of starting to enforce.
          fetch-depth: 0
      - name: JSON is valid and iOS/Android resource mirrors are in sync
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          root = pathlib.Path('.')
          canonical = {
            'packages/metric-ontology/registry.json': [
              'apps/ios/Sources/Resources/registry.json',
              'apps/android/app/src/main/assets/registry.json',
            ],
            'packages/contracts/insights/templates.json': [
              'apps/ios/Sources/Resources/insight_templates.json',
              'apps/android/app/src/main/assets/insight_templates.json',
            ],
            'packages/contracts/dictionaries/symptoms.json': [
              'apps/ios/Sources/Resources/symptoms.json',
              'apps/android/app/src/main/assets/symptoms.json',
            ],
            'packages/export-schemas/csv_columns.json': [
              'apps/ios/Sources/Resources/csv_columns.json',
              'apps/android/app/src/main/assets/csv_columns.json',
            ],
            # Added to both sync scripts by EPIC-07 but not to this map, which is the gap that
            # lets a mirror rot: registry.json sat 28 metrics behind its source in both bundles
            # precisely because nothing compared them on a push. A contract that is worth
            # mirroring is worth checking here — if you add a cp line to a sync script, add the
            # pair here in the same change.
            'packages/contracts/algorithms/algorithms.json': [
              'apps/ios/Sources/Resources/algorithms.json',
              'apps/android/app/src/main/assets/algorithms.json',
            ],
            # ADR-0011 / D-37. iOS only: Android has no telemetry client, so there is no Android
            # mirror to keep honest. This is the schema that IS the payload boundary, so a drifted
            # copy would mean the client and the server disagreed about what may be sent.
            'packages/contracts/telemetry/footprint.schema.json': [
              'apps/ios/Sources/Resources/footprint.schema.json',
            ],
            'packages/contracts/sensor_quality.json': [
              'apps/ios/Sources/Resources/sensor_quality.json',
              'apps/android/app/src/main/assets/sensor_quality.json',
            ],
            # Both of these had cp lines in BOTH sync scripts and no entry here — the exact gap the
            # note above describes, reopened twice. beverages.json arrived with hydration (EPIC-38)
            # and behaviors.json with the journal (EPIC-29); each shipped a mirror that nothing
            # compared on a push. behaviors.json matters most of the three-way set: it is the
            # dictionary the correlation engine splits arms on, so a stale mirror on one platform
            # means the two compute findings over different behaviour vocabularies and the shared
            # fixture is the only thing left that would notice.
            'packages/contracts/dictionaries/beverages.json': [
              'apps/ios/Sources/Resources/beverages.json',
              'apps/android/app/src/main/assets/beverages.json',
            ],
            'packages/contracts/dictionaries/behaviors.json': [
              'apps/ios/Sources/Resources/behaviors.json',
              'apps/android/app/src/main/assets/behaviors.json',
            ],
          }
          fail = False
          for src, mirrors in canonical.items():
            a = json.loads((root/src).read_text())
            for mirror in mirrors:
              b = json.loads((root/mirror).read_text())
              if a != b:
                sync_script = 'scripts/sync_android_assets.sh' if 'android' in mirror else 'scripts/sync_ios_resources.sh'
                print(f"::error::{mirror} is out of sync with {src} — run {sync_script}")
                fail = True
          print("metrics:", len(json.loads((root/'packages/metric-ontology/registry.json').read_text())['metrics']))
          sys.exit(1 if fail else 0)
          PY
      # scripts/check_fixture_hashes.sh was added alongside the canonicalization fixture but was
      # never invoked by anything, so its own docstring ("should be caught on a plain checkout
      # too, in one second, naming the file") described a guard that did not run. Both test
      # suites verify the hash before parsing, but only where a JVM or a simulator is available —
      # which is the expensive half of CI and, on a contracts-only change, may not run at all.
      # Delete this step and a mangled fixture (CRLF checkout, bad merge, well-meaning reformat)
      # resurfaces as a cross-platform "the two disagree" failure pointing at Units instead.
      - name: Shared fixtures match their recorded hashes
        run: scripts/check_fixture_hashes.sh
      # EPIC-22. DATA_DICTIONARY.md is generated from packages/export-schemas/ + registry.json, so
      # the one way it can be wrong is by being stale. --check regenerates in memory and diffs,
      # which turns "someone changed a column and forgot the docs" from a thing a reader discovers
      # into a thing the build says. It also cross-checks that csv_columns.json and
      # json_bundle.schema.json agree on export_schema_version — two halves of one contract that
      # can otherwise drift apart without either file looking wrong on its own.
      - name: Data dictionary is regenerated from the contracts (EPIC-22)
        run: scripts/gen_data_dictionary.py --check
      # The point of writing json_bundle.schema.json as a real JSON Schema rather than prose is
      # that something can validate against it. Nothing did until this step, which made "real JSON
      # Schema" a claim about the file's syntax rather than about the bundle's contents. The golden
      # is the bundle both platforms are asserted byte-identical on, so validating it validates the
      # shape both writers actually emit.
      #
      # Four fixtures are validated, not one, because every OPTIONAL key in this schema is a section
      # that a single full-export fixture leaves untouched. bundle-v1.json carries no drinks, no
      # journal and no config, so on its own it left each of those sections documented but
      # unexercised — a writer or schema drift on them would have passed CI unnoticed, which is
      # exactly what happened three times running (hydration EPIC-38, delta EPIC-17, journal
      # EPIC-29 each shipped a new key with no fixture behind it).
      #
      # bundle-hydration-v1.json covers logs.hydration as ExportRunner emits it (entries incl. an
      # append-first revision, summaries with and without a goal, goals, beverages, sources,
      # redaction manifest). bundle-journal-v1.json covers logs.journal + logs.context_statuses and
      # the root config echo. The delta pair covers is_delta, both cursors, previous_manifest_sha
      # and corrections[]. bundle-v1.json stays the byte-stable cross-platform parity golden and
      # MUST NOT be edited to carry any of them (see packages/fixtures/export/README.md): a golden
      # with none of the optional keys is what proves absent-when-empty still holds.
      #
      # The coverage assertion below is the part that keeps this list honest. Validating N fixtures
      # proves nothing about the N+1th section someone adds next month; requiring every optional key
      # the schema DECLARES to appear in at least one validated fixture is what makes the omission
      # fail the build instead of being discovered by a consumer.
      - name: The export bundle fixtures validate against their own JSON Schema, and exercise every optional key
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'jsonschema>=4,<5'
          python3 - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          root = pathlib.Path('.')
          schema = json.loads((root/'packages/export-schemas/json_bundle.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          fixtures = [
            'packages/fixtures/export/bundle-v1.json',            # no optional keys (parity golden)
            'packages/fixtures/export/bundle-hydration-v1.json',  # exercises logs.hydration
            # EPIC-29: the only fixture carrying logs.journal + logs.context_statuses (both
            # sensitive-plus, both absent-when-empty) and the root `config` echo.
            'packages/fixtures/export/bundle-journal-v1.json',
            # EPIC-17: the delta pair exercises the schema's delta fields — is_delta, both cursors,
            # previous_manifest_sha and the corrections[] section — which a full export leaves null
            # or absent, so nothing else in this list can catch a drift in them.
            'packages/fixtures/export/delta-chain/delta-run1-v1.json',
            'packages/fixtures/export/delta-chain/delta-run2-v1.json',
          ]
          fail = False
          bundles = {}
          for rel in fixtures:
            bundle = json.loads((root/rel).read_text())
            bundles[rel] = bundle
            errors = sorted(validator.iter_errors(bundle), key=lambda e: list(e.path))
            for error in errors:
              location = '/'.join(str(p) for p in error.path) or '<root>'
              print(f"::error::{rel} at {location}: {error.message}")
              fail = True

          # Coverage: every optional key, at the root and inside `logs`, must be present in at least
          # one fixture above. Derived from the schema rather than listed here, so a key added to the
          # schema without a fixture fails immediately — the check cannot be out of date with the
          # contract it polices.
          def optional(node):
            return [k for k in node.get('properties', {}) if k not in node.get('required', [])]

          sections = {'': (schema, [b for b in bundles.values()]),
                      'logs.': (schema['properties']['logs'],
                                [b.get('logs', {}) for b in bundles.values()])}
          for prefix, (node, instances) in sections.items():
            for key in optional(node):
              if not any(key in instance for instance in instances):
                print(f"::error::no validated fixture carries `{prefix}{key}` — the schema documents "
                      f"it but nothing here exercises it. Add a fixture that emits it (see "
                      f"packages/fixtures/export/README.md) rather than deleting this check.")
                fail = True
              else:
                print(f"covered: {prefix}{key}")
          sys.exit(1 if fail else 0)
          PY
      # EPIC-17 / §22.6. Delta export tells people "this file contains only what is new" — a claim
      # that is only worth anything if a consumer can CHECK it. scripts/verify_export_chain.py is
      # the reference checker (previous_manifest_sha links, one root, no gaps, monotonic cursors),
      # and the delta-chain fixtures are a real two-run sequence for it to walk.
      #
      # The negative control is the load-bearing half. A verifier that never rejects anything passes
      # every folder handed to it and proves nothing; appending one byte to the root breaks its
      # sha256, which must dangle the second bundle's link and fail the run. If the tamper case ever
      # starts passing, the positive case above stopped meaning anything.
      - name: Delta export chain verifies, and a tampered chain does not (EPIC-17)
        run: |
          set -euo pipefail
          python3 scripts/verify_export_chain.py packages/fixtures/export/delta-chain
          tampered="$(mktemp -d)"
          cp packages/fixtures/export/delta-chain/delta-run*.json "$tampered/"
          printf '\n' >> "$tampered/delta-run1-v1.json"
          if python3 scripts/verify_export_chain.py "$tampered" > /dev/null 2>&1; then
            echo "::error::verify_export_chain.py accepted a tampered chain — the verifier proves nothing"
            exit 1
          fi
          echo "delta chain verified; a tampered chain was correctly rejected"
      # The version lives in several places that must never disagree: the two contract files, the
      # constant each platform's writers actually stamp into an artifact, the schema's own manifest
      # section, and the fixture sets that declare which version their bytes were produced at. A
      # file labelled 1.0.0 whose writer emits 0.9.0 is worse than an unversioned one — it tells a
      # consumer how to read bytes that are not there.
      #
      # The fixture declarations are in the list because they are how a HALF-DONE bump surfaces
      # cheaply. Bumping the constants without regenerating the goldens leaves a fixture set whose
      # manifest still claims the old version; the parity suites would catch it, but only on the
      # runners that have a JVM or a simulator, and a contracts-only change may not reach them.
      - name: Export schema version agrees across contracts, both writers, and the fixtures
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path('.')
          version = json.loads((root/'packages/export-schemas/csv_columns.json').read_text())['version']
          schema = json.loads((root/'packages/export-schemas/json_bundle.schema.json').read_text())
          swift = (root/'apps/ios/Sources/Export/CSVWriter.swift').read_text()
          kotlin = (root/'apps/android/app/src/main/java/net/albayyan/badan/export/CsvWriter.kt').read_text()

          found = {
            'csv_columns.json': version,
            'json_bundle.schema.json (envelope)':
              schema['properties']['export_schema_version']['const'],
            # The manifest section repeats the const, so a bump that edited only the envelope would
            # leave a schema that no real bundle can satisfy in both places at once.
            'json_bundle.schema.json (manifest)':
              schema['$defs']['manifest']['properties']['export_schema_version']['const'],
            'ExportSchema.version (iOS)': re.search(r'static let version = "([^"]+)"', swift).group(1),
            'ExportSchema.VERSION (Android)': re.search(r'const val VERSION: String = "([^"]+)"', kotlin).group(1),
          }

          # Fixture sets are DISCOVERED, not listed: any JSON under packages/fixtures/ declaring a
          # top-level exportSchemaVersion is claiming which contract its bytes were produced at, and
          # a list here would go stale the first time a fixture set is added — the same rot this
          # whole step exists to catch.
          for path in sorted((root/'packages/fixtures').rglob('*.json')):
            try:
              declared = json.loads(path.read_text())
            except json.JSONDecodeError:
              continue
            if isinstance(declared, dict) and 'exportSchemaVersion' in declared:
              found[str(path)] = declared['exportSchemaVersion']
          if len(set(found.values())) != 1:
            for where, value in found.items():
              print(f"::error::{where} says export schema {value}")
            sys.exit(1)
          print(f"export schema {version} agrees across {len(found)} sources")
          PY
      - name: App Store legal pages exist and are placeholder-free
        run: |
          set -euo pipefail
          for f in docs/legal/privacy.html docs/legal/eula.html docs/legal/support.html; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — App Store requires hosted privacy/EULA/support pages"
              exit 1
            fi
          done
          if grep -InE 'TODO|PLACEHOLDER|\[CONTACT|REPLACE[_ ]?ME|example\.com|lorem ipsum|<insert|TBD\b' docs/legal/*.html; then
            echo "::error::docs/legal/*.html still contains a placeholder token — fill it in before release"
            exit 1
          fi
      - name: Export generation stays network-free; delivery is isolated (ADR D-8 / §8.3)
        run: |
          set -euo pipefail
          # §8.3: the network-free guarantee is load-bearing for GENERATION (writers + runner) and
          # stays true there. Delivery to a user-chosen destination is network by definition and
          # lives ONLY in the Destinations layer, which is excluded here and checked separately below.
          #
          # TWO patterns per platform, not one. The API list alone did not close the hole: iOS's
          # `Data(contentsOf:)` performs a synchronous GET when handed an http(s) URL and matches
          # none of URLSession / import Network / NSURLConnection, and the same is true of
          # CFNetwork and raw POSIX sockets. `Data(contentsOf:)` cannot simply be banned either —
          # `ExportRunner.encryptResult` legitimately uses it to read the files it has just written
          # back off disk, so the shape is present in generation today and must stay green.
          #
          # So the second pattern bans what a REMOTE read needs instead of the read itself: a
          # remote URL. Generation derives every URL it touches from the app container
          # (`appendingPathComponent` off its own temp folder), so `URL(string:)` / `URLComponents`
          # / `URLRequest` — the only ways to construct an http(s) URL — have no business there,
          # and have zero occurrences today. With those banned, a `Data(contentsOf:)` inside
          # generation provably holds a file URL.
          #
          # Stated precisely so the guarantee is not overread: together these prove generation
          # cannot open a socket and cannot BUILD a remote URL. They say nothing about a URL handed
          # in from outside — no generation entry point takes one today, and adding one is the
          # change that must revisit this note.
          IOS_NET_API='URLSession|import Network|NSURLConnection|CFNetwork|CFReadStream|CFSocket|NWConnection|NWListener|getaddrinfo|[^A-Za-z_]socket\(|sendto\(|recvfrom\('
          IOS_REMOTE_URL='URL\(string:|NSURL\(string:|URLComponents|URLRequest'
          AND_NET_API='HttpURLConnection|okhttp|io\.ktor|java\.net\.Socket|java\.net\.DatagramSocket|java\.nio\.channels\.SocketChannel|java\.net\.InetAddress|openConnection|openStream'
          AND_REMOTE_URL='java\.net\.URL|java\.net\.URI|Uri\.parse|\.toURL\('

          fail=0
          scan() {  # scan <root> <excluded-path-fragment> <regex> <message>
            local hits
            hits="$(grep -rnE "$3" "$1" | grep -v "$2" || true)"
            if [ -n "$hits" ]; then
              echo "::error::$4"
              printf '%s\n' "$hits"
              fail=1
            fi
          }

          scan apps/ios/Sources/Export/ '/Destinations/' "$IOS_NET_API" \
            "apps/ios/Sources/Export/ (writers/runner) references a networking API — export generation must stay network-free (ADR D-8)"
          scan apps/ios/Sources/Export/ '/Destinations/' "$IOS_REMOTE_URL" \
            "apps/ios/Sources/Export/ (writers/runner) constructs a URL from a string — generation may only touch file URLs it derived from its own output folder, and a remote Data(contentsOf:) is exactly what this forbids (§8.3)"
          scan apps/android/app/src/main/java/net/albayyan/badan/export/ '/destinations/' "$AND_NET_API" \
            "Android export generation references a networking API — export generation must stay network-free (ADR D-8)"
          scan apps/android/app/src/main/java/net/albayyan/badan/export/ '/destinations/' "$AND_REMOTE_URL" \
            "Android export generation constructs a java.net URL/URI — generation may only touch java.io.File paths under its own output dir (§8.3)"

          # ADR-0011 / D-37: BADAN now has TWO surfaces allowed to open a socket, and until this
          # existed nothing in CI would have caught a third. The socket-API pattern therefore widens
          # from Sources/Export/ to ALL of Sources/, with an explicit allowlist.
          #
          # Only IOS_NET_API widens. IOS_REMOTE_URL stays scoped to export generation on purpose:
          # constructing a URL is legitimate all over the app (shortcuts:// deep links, App Store
          # links, UIApplication.openSettingsURLString), and it proves something only inside
          # generation, where it shows a remote Data(contentsOf:) is impossible. Widening it would
          # produce noise, and a gate that cries wolf gets deleted.
          #
          # The allowlist is the whole point — adding a file here should require saying why in a PR.
          #   Platform/AICoach/AICoachClient.swift        the AI coach (ADR-0010 / D-22)
          #   Platform/Telemetry/FootprintClient.swift    methodology telemetry (ADR-0011 / D-37)
          #   Platform/Account/AccountClient.swift        accounts + entitlement sync (ADR-0014 / D-44)
          #   Export/Destinations/RESTDestination*.swift  the user's own configured export endpoint
          #
          # 2026-08-07: the third entry is the one to read twice. ADR-0014 reversed D-32's
          # no-accounts posture, so this list grew for the first time since ADR-0011 — and the
          # reason it is a list rather than a "no network" rule is precisely so a reversal has to
          # be written down here, in a diff, next to the ADR that authorised it. A FOURTH still
          # requires a new decision. The Never that did NOT move is "send no health data off
          # device": AccountPayloadShapeTests pins the encoded shape of every request this new
          # client can build, and test_the_accounts_schema_holds_no_health_column pins the
          # server's columns.
          NET_ALLOWLIST='Sources/Platform/AICoach/AICoachClient.swift|Sources/Platform/Telemetry/FootprintClient.swift|Sources/Platform/Account/AccountClient.swift|Sources/Export/Destinations/RESTDestination.swift|Sources/Export/Destinations/RESTDestinationAvailability.swift'
          net_hits="$(grep -rnE "$IOS_NET_API" apps/ios/Sources/ | grep -vE "$NET_ALLOWLIST" || true)"
          if [ -n "$net_hits" ]; then
            echo "::error::A file outside the network allowlist references a socket-opening API. BADAN reaches the network from exactly three of its own surfaces (AI coach, methodology telemetry, the account service) plus the user-configured REST export destination. A fourth requires an ADR — see ADR-0010, ADR-0011 and ADR-0014."
            printf '%s\n' "$net_hits"
            fail=1
          fi

          # Android repo-wide mirror of the widening directly above. Before this, $AND_NET_API was
          # scanned only inside export/ (the two `scan` calls near the top of this step, both
          # excluding /destinations/) — nothing checked the rest of
          # apps/android/app/src/main/java/ at all, so a socket opened anywhere else in the app
          # would have passed CI silently. Android has no AI-coach or telemetry client yet (both
          # are iOS-only today — see ADR-0010/ADR-0011 and CLAUDE.md), so unlike the iOS
          # allowlist above this one names a single surface.
          #
          # The allowlist below was derived by running this exact grep locally over
          # apps/android/app/src/main/java/ (not just export/) and triaging every hit — see the
          # B0-5 task report for the raw output. Today there is exactly one match, all inside one
          # file:
          #   export/destinations/RestDestination.kt   the user-configured REST export
          #                                             destination's HttpURLConnection transport
          #                                             (network by definition, same class as the
          #                                             iOS RESTDestination.swift entry above) —
          #                                             gated off by
          #                                             RestDestinationAvailability.ENABLED
          #                                             (false today; see that file's KDoc for the
          #                                             four things that must move together before
          #                                             this deliverer actually ships)
          AND_NET_ALLOWLIST='net/albayyan/badan/export/destinations/RestDestination\.kt'
          and_net_hits="$(grep -rnE "$AND_NET_API" apps/android/app/src/main/java/ | grep -vE "$AND_NET_ALLOWLIST" || true)"
          if [ -n "$and_net_hits" ]; then
            echo "::error::A file outside the Android network allowlist references a socket-opening API. Android reaches the network from exactly one surface today (the user-configured REST export destination). A second requires an ADR — see ADR-0010 and ADR-0011 — and an entry in AND_NET_ALLOWLIST with a citation, added in the same change."
            printf '%s\n' "$and_net_hits"
            fail=1
          fi

          # §8.3: the Destinations layer moves finished artifacts and must NOT reach into writer
          # internals — it consumes file URLs + manifests only. Enforced by banning construction of,
          # or static access to, the concrete writer/runner types. (ExportSchema, a shared version
          # constant used for a header default, is deliberately not in this list.)
          if grep -rnE '(CSVWriter|JSONBundleWriter|GPXWriter|WideCSVProjector|MetricAggregator|HydrationExport|ExportEncryption|ExportEncryptor|ExportRunner|BackupBundle)[(.]' apps/ios/Sources/Export/Destinations/; then
            echo "::error::apps/ios/Sources/Export/Destinations/ reaches into a writer/runner internal — destinations consume file URLs + manifests only (§8.3)"
            fail=1
          fi
          # Android mirror of the isolation half. Same rule, same reason: a destination that reached
          # into a writer would couple the networked layer to generation, and the two must stay
          # provably separate. (ExportSchema is excluded here too — it is a version constant.)
          if grep -rnE '(CsvWriter|JsonBundleWriter|GpxWriter|WideCsvProjector|MetricAggregator|HydrationExport|ExportEncryptor|ExportRunner|BackupBundle)[(.]' apps/android/app/src/main/java/net/albayyan/badan/export/destinations/; then
            echo "::error::Android export/destinations/ reaches into a writer/runner internal — destinations consume files + manifests only (§8.3)"
            fail=1
          fi

          # Negative + positive control, the load-bearing half. A lint whose patterns silently stop
          # matching passes forever and proves nothing — the same reasoning as the tampered-chain
          # check above. These probes are synthetic files in a temp dir, never part of the app.
          probe="$(mktemp -d)"
          mkdir -p "$probe/ios" "$probe/android"
          # Must be CAUGHT: the exact shape the audit named — a remote read that no networking-API
          # pattern matches.
          printf 'let leaked = try Data(contentsOf: URL(string: "https://example.invalid/x")!)\n' > "$probe/ios/Leak.swift"
          printf 'val leaked = java.net.URL("https://example.invalid/x").openStream().readBytes()\n' > "$probe/android/Leak.kt"
          # Must be IGNORED: the legitimate local read that lives in ExportRunner today. If this
          # ever starts matching, the lint has become a false-positive generator and the real fix
          # will be to weaken it — which is exactly what this control is here to make visible.
          printf 'let files = try Data(contentsOf: folder.appendingPathComponent("raw.csv"))\n' > "$probe/ios/Local.swift"
          printf 'val files = java.io.File(outputDir, "raw.csv").readBytes()\n' > "$probe/android/Local.kt"

          if ! grep -qE "$IOS_REMOTE_URL" "$probe/ios/Leak.swift"; then
            echo "::error::the iOS remote-URL pattern no longer catches a remote Data(contentsOf:) — the §8.3 generation lint proves nothing"
            fail=1
          fi
          if ! grep -qE "$AND_NET_API" "$probe/android/Leak.kt"; then
            echo "::error::the Android networking pattern no longer catches java.net.URL(...).openStream() — the §8.3 generation lint proves nothing"
            fail=1
          fi
          if grep -qE "$IOS_NET_API|$IOS_REMOTE_URL" "$probe/ios/Local.swift"; then
            echo "::error::the iOS generation lint now flags a legitimate local-file Data(contentsOf:) — it would fail ExportRunner.encryptResult"
            fail=1
          fi
          if grep -qE "$AND_NET_API|$AND_REMOTE_URL" "$probe/android/Local.kt"; then
            echo "::error::the Android generation lint now flags a legitimate local File read"
            fail=1
          fi
          rm -rf "$probe"

          if [ "$fail" -eq 0 ]; then
            echo "export generation is network-free on both platforms; the lint caught its remote-read probes and ignored its local-read probes"
          fi
          exit $fail
      - name: Insight template copy stays inside the wellness-language guardrails (ADR D-11)
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          root = pathlib.Path('.')
          data = json.loads((root/'packages/contracts/insights/templates.json').read_text())

          # Derive the banned lexicon from wellnessRules itself, so the lint can never drift from
          # the policy it enforces: each "Avoid ... (term, term, ...)" rule names its own terms.
          lexicon = set()
          for rule in data['wellnessRules']:
            if not rule.startswith('Avoid'):
              continue
            m = re.search(r'\(([^)]*)\)', rule)
            if not m:
              continue
            for item in m.group(1).split(','):
              item = item.strip().strip("'")
              if not item or 'named' in item:
                continue
              for part in item.split('/'):
                lexicon.add(part.strip().lower())

          violations = []
          for t in data['templates']:
            for field in ('textEn', 'textAr'):
              text = t.get(field, '').lower()
              for term in lexicon:
                if term in text:
                  violations.append(f"{t['id']}.{field} contains banned term '{term}'")

          if violations:
            for v in violations:
              print(f"::error::packages/contracts/insights/templates.json: {v}")
            sys.exit(1)
          PY
      - name: Design tokens stay in sync with Tokens.swift / Tokens.kt
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib

          root = pathlib.Path('.')
          tokens = json.loads((root/'docs/design/design-tokens.json').read_text())
          swift = (root/'apps/ios/Sources/DesignSystem/Tokens.swift').read_text()
          kotlin = (root/'apps/android/app/src/main/java/net/albayyan/badan/designsystem/Tokens.kt').read_text()

          fail = False
          def err(msg):
            global fail
            print(f"::error::{msg}")
            fail = True

          swift_colors = {m.group(1): (m.group(2).upper(), m.group(3).upper())
                           for m in re.finditer(r'static let (\w+) = Color\(light: "#([0-9A-Fa-f]{6})", dark: "#([0-9A-Fa-f]{6})"\)', swift)}
          swift_nums = {m.group(1): int(m.group(2)) for m in re.finditer(r'static let (\w+): CGFloat = (\d+)', swift)}

          def kt_colors(fn):
            block = re.search(fn + r'\(\): BadanColors = BadanColors\((.*?)\n\)\n', kotlin, re.S).group(1)
            out = {m.group(1): m.group(2).upper() for m in re.finditer(r'(\w+) = Color\(0xFF([0-9A-Fa-f]{6})\)', block)}
            # Color.White / Color.Black are Compose's named constants for the same hex values —
            # match them too so a token expressed idiomatically doesn't read as "undefined".
            out.update({m.group(1): 'FFFFFF' for m in re.finditer(r'(\w+) = Color\.White\b', block)})
            out.update({m.group(1): '000000' for m in re.finditer(r'(\w+) = Color\.Black\b', block)})
            return out
          kt_light, kt_dark = kt_colors('fun badanLightColors'), kt_colors('fun badanDarkColors')
          kt_nums = {m.group(1): int(m.group(2)) for m in re.finditer(r'val (\w+) = (\d+)\.dp', kotlin)}

          # JSON key -> shared Swift/Kotlin field name (statusColors names differ from the token names).
          color_map = {
            'background': 'background', 'surface': 'surface', 'surfaceElevated': 'surfaceElevated',
            'primary': 'primary', 'onPrimary': 'onPrimary',
            'textPrimary': 'textPrimary', 'textSecondary': 'textSecondary',
            'separator': 'separator',
            'withinRange': 'inBand', 'above': 'outOfBand', 'below': 'outOfBand',
            'neutral': 'info', 'critical': 'critical',
          }
          palette = {**tokens['palette'], **tokens['statusColors']}
          for json_key, code_key in color_map.items():
            entry = palette[json_key]
            want = (entry['light'].lstrip('#').upper(), entry['dark'].lstrip('#').upper())
            got_swift = swift_colors.get(code_key, (None, None))
            if got_swift != want:
              err(f"Tokens.swift BadanColor.{code_key} {got_swift} != design-tokens.json palette.{json_key} {want}")
            got_kt = (kt_light.get(code_key), kt_dark.get(code_key))
            if got_kt != want:
              err(f"Tokens.kt {code_key} {got_kt} != design-tokens.json palette.{json_key} {want}")

          # Spacing/radii — touchMin is excluded: 44pt (iOS HIG) vs 48dp (Android Material) is an
          # intentional per-platform divergence, not drift.
          space_map = {f'space{i}': (f'space{i}', f's{i}') for i in range(1, 9)}
          space_map['cardPadding'] = ('cardPadding', 'cardPadding')
          for json_key, (swift_key, kt_key) in space_map.items():
            want = tokens['spacing'][json_key]
            if swift_nums.get(swift_key) != want:
              err(f"Tokens.swift BadanSpace.{swift_key} ({swift_nums.get(swift_key)}) != design-tokens.json spacing.{json_key} ({want})")
            if kt_nums.get(kt_key) != want:
              err(f"Tokens.kt BadanSpace.{kt_key} ({kt_nums.get(kt_key)}) != design-tokens.json spacing.{json_key} ({want})")

          for json_key in ('chip', 'control', 'card', 'sheet'):
            want = tokens['radii'][json_key]
            if swift_nums.get(json_key) != want:
              err(f"Tokens.swift BadanRadius.{json_key} ({swift_nums.get(json_key)}) != design-tokens.json radii.{json_key} ({want})")
            if kt_nums.get(json_key) != want:
              err(f"Tokens.kt BadanRadius.{json_key} ({kt_nums.get(json_key)}) != design-tokens.json radii.{json_key} ({want})")

          sys.exit(1 if fail else 0)
          PY
      - name: Design token colour pairs meet WCAG AA contrast (portfolio Matrix #8)
        run: |
          python3 - <<'PY'
          # Walks every (foreground, background) token pair BADAN's design system actually
          # permits and asserts WCAG AA: >=4.5:1 for text, >=3:1 for non-text UI (icons, filled
          # controls). This is the check that would have caught the onPrimary/Color.White defect
          # (ledger #9): the token itself was correct, but nothing asserted the pairing, so
          # nothing caught call sites drifting from it. Reads design-tokens.json only, since
          # Tokens.swift/Tokens.kt are already asserted byte-identical to it by the previous step.
          import json, sys, pathlib

          root = pathlib.Path('.')
          tokens = json.loads((root/'docs/design/design-tokens.json').read_text())
          palette = {**tokens['palette'], **tokens['statusColors']}

          def hex_of(name, theme):
            return palette[name][theme].lstrip('#').upper()

          def luminance(hex6):
            def lin(c):
              c = c / 255.0
              return c / 12.92 if c <= 0.03928 else ((c + 0.055) / 1.055) ** 2.4
            r, g, b = int(hex6[0:2], 16), int(hex6[2:4], 16), int(hex6[4:6], 16)
            return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b)

          def contrast(fg_hex, bg_hex):
            l1, l2 = luminance(fg_hex), luminance(bg_hex)
            l1, l2 = max(l1, l2), min(l1, l2)
            return (l1 + 0.05) / (l2 + 0.05)

          # (foreground token, background token, kind) — every fg-on-bg pairing the design
          # system's own components actually paint. "text" = body/label text, >=4.5:1.
          # "ui" = icons, filled buttons/chips, graphical objects, >=3:1 (WCAG 1.4.11).
          TEXT, UI = 'text', 'ui'
          PAIRS = [
            ('textPrimary', 'background', TEXT),
            ('textPrimary', 'surface', TEXT),
            ('textPrimary', 'surfaceElevated', TEXT),
            ('textSecondary', 'background', TEXT),
            ('textSecondary', 'surface', TEXT),
            ('textSecondary', 'surfaceElevated', TEXT),
            # The pairing item 1/ledger#9 broke: text/icon content on a primary-filled control
            # (save buttons, selected chips) must use onPrimary, never a raw literal.
            ('onPrimary', 'primary', TEXT),
            ('primary', 'background', UI),
            ('primary', 'surface', UI),
            ('withinRange', 'background', UI),
            ('withinRange', 'surface', UI),
            ('above', 'background', UI),
            ('above', 'surface', UI),
            ('below', 'background', UI),
            ('below', 'surface', UI),
            ('neutral', 'background', UI),
            ('neutral', 'surface', UI),
            ('critical', 'background', UI),
            ('critical', 'surface', UI),
          ]
          THRESHOLD = {TEXT: 4.5, UI: 3.0}

          fail = False
          for fg, bg, kind in PAIRS:
            for theme in ('light', 'dark'):
              ratio = contrast(hex_of(fg, theme), hex_of(bg, theme))
              need = THRESHOLD[kind]
              status = 'OK' if ratio >= need else 'FAIL'
              print(f"{status:4} {theme:5} {fg} on {bg} ({kind}): {ratio:.2f}:1 (need {need}:1)")
              if ratio < need:
                fail = True

          if fail:
            print("::error::one or more design-token colour pairs fail WCAG AA — see FAIL lines above")
          sys.exit(1 if fail else 0)
          PY
      - name: Motion durations stay tokenized (ratchet, ledger #36)
        run: |
          set -euo pipefail
          # Literal animation durations outside the design system — the exact shape of the bug
          # this ratchet exists to catch: 34 sites across 12 files, none routed through Reduce
          # Motion, one file (onboarding) honoring the setting while every other animated screen
          # ignored it. Baseline is honest (0, the count right after the full migration) and this
          # gate only allows it to move down, never up — every new literal duration is a new call
          # site that silently drops Reduce Motion, same class as ledger #9's `Color.White` bypass.
          IOS_BASELINE=0
          ANDROID_BASELINE=0
          ios_count=$(grep -rnE 'duration: [0-9]' apps/ios/Sources --include='*.swift' | grep -vc '/DesignSystem/' || true)
          android_count=$(grep -rnE 'durationMillis\s*=\s*[0-9]' apps/android/app/src/main/java --include='*.kt' | grep -vc '/designsystem/' || true)
          echo "iOS literal durations outside DesignSystem: $ios_count (baseline $IOS_BASELINE)"
          echo "Android literal durationMillis outside designsystem: $android_count (baseline $ANDROID_BASELINE)"
          fail=0
          if [ "$ios_count" -gt "$IOS_BASELINE" ]; then
            echo "::error::iOS literal animation durations outside DesignSystem/ rose to $ios_count (baseline $IOS_BASELINE) — route new animations through BadanMotion instead of a bare duration: literal"
            grep -rnE 'duration: [0-9]' apps/ios/Sources --include='*.swift' | grep -v '/DesignSystem/' || true
            fail=1
          fi
          if [ "$android_count" -gt "$ANDROID_BASELINE" ]; then
            echo "::error::Android literal durationMillis outside designsystem/ rose to $android_count (baseline $ANDROID_BASELINE) — route new animations through BadanMotion instead of a bare durationMillis literal"
            grep -rnE 'durationMillis\s*=\s*[0-9]' apps/android/app/src/main/java --include='*.kt' | grep -v '/designsystem/' || true
            fail=1
          fi
          exit $fail
      - name: Android screens use the onPrimary token, not raw Color.White (UIUX-223)
        run: |
          set -euo pipefail
          if grep -rn 'Color\.White' apps/android/app/src/main/java --include='*.kt' | grep -v '/designsystem/'; then
            echo "::error::Color.White used outside net.albayyan.badan.designsystem — use BadanTheme.colors.onPrimary (or another semantic token) instead of a raw literal, or the site risks shipping unreadable text/icons on a themed fill"
            exit 1
          fi
      - name: App icons carry no alpha channel (ITMS-90717)
        run: |
          python3 - <<'PY'
          import glob, struct, sys
          fail = False
          for path in sorted(glob.glob('apps/ios/**/*.appiconset/*.png', recursive=True)):
            with open(path, 'rb') as f:
              header = f.read(33)
            width, height = struct.unpack('>II', header[16:24])
            colortype = header[25]
            if colortype != 2:
              print(f"::error::{path} is PNG colortype {colortype} (expected 2/RGB, no alpha) — App Store rejects alpha-bearing icons (ITMS-90717)")
              fail = True
            if '1024' in path and (width, height) != (1024, 1024):
              print(f"::error::{path} is {width}x{height} (expected 1024x1024)")
              fail = True
          sys.exit(1 if fail else 0)
          PY
      # ADR-0012 / the Android parity port (docs/android-port-conventions.md). The port runs many
      # agents concurrently against apps/android; the two failure modes that matter are a task
      # editing a file outside its declared scope, and a task editing a magnet file nobody froze.
      # scripts/check_task_ownership.sh is the PRIMARY guard (any out-of-scope diff fails, listed
      # or not); scripts/check_frozen_files.sh is the backstop (only the files listed in
      # scripts/frozen-files.txt). Both are meant to run locally in every task's self-verify loop
      # (docs/android-port-conventions.md §9) — this step is what keeps them provably working, the
      # same "prove the gate actually catches what it should" idiom as the network-free lint below
      # (positive + negative control, synthetic probes, cleaned up after).
      #
      # Runnable locally exactly as written here: bash -n the scripts, then run each with a real
      # and a synthetic-probe invocation from the repo root.
      - name: Android port guard scripts are wired and prove they catch ownership violations
        run: |
          set -euo pipefail
          bash -n scripts/check_task_ownership.sh
          bash -n scripts/check_frozen_files.sh
          test -x scripts/check_task_ownership.sh
          test -x scripts/check_frozen_files.sh

          # scripts/check_frozen_files.sh: runnable for real right now. Before Batch 1 cuts the
          # `android-port-scaffold` tag it must degrade to a no-op (exit 0) rather than failing
          # every push — this asserts that posture explicitly rather than trusting it silently.
          if git rev-parse --verify --quiet android-port-scaffold >/dev/null 2>&1; then
            echo "android-port-scaffold exists — frozen-file check is enforcing for real"
            bash scripts/check_frozen_files.sh
          else
            echo "android-port-scaffold does not exist yet (expected pre-Batch-1) — asserting the no-op path"
            out="$(bash scripts/check_frozen_files.sh)"
            echo "$out"
            if ! grep -q "does not exist yet" <<<"$out"; then
              echo "::error::check_frozen_files.sh did not report its expected pre-Batch-1 no-op message — its graceful-degrade path may be broken"
              exit 1
            fi
          fi

          # scripts/check_task_ownership.sh: a clean CI checkout has no working-tree changes, so
          # calling it as-is would trivially report success and prove nothing (the same reasoning
          # as the tampered-chain / probe controls elsewhere in this file). Instead, dirty the
          # checkout with one throwaway file and prove both directions: caught when out of a
          # declared scope, ignored when inside one. Never part of the app; removed before exit.
          probe_path="apps/android/app/src/main/java/net/albayyan/badan/CiOwnershipProbe.kt"
          cleanup() { rm -f "$probe_path"; }
          trap cleanup EXIT

          echo "// CI ownership-guard probe — never committed" > "$probe_path"

          scope_wrong="$(mktemp)"
          echo "docs/android-port-conventions.md" > "$scope_wrong"
          if bash scripts/check_task_ownership.sh "$scope_wrong"; then
            echo "::error::check_task_ownership.sh accepted a change ($probe_path) outside its declared scope — the guard proves nothing"
            exit 1
          fi

          scope_right="$(mktemp)"
          echo "$probe_path" > "$scope_right"
          if ! bash scripts/check_task_ownership.sh "$scope_right"; then
            echo "::error::check_task_ownership.sh rejected a change ($probe_path) that WAS inside its declared scope — false positive, the guard would block legitimate work"
            exit 1
          fi

          echo "ownership guard: caught its out-of-scope probe, accepted its in-scope probe"

  ios-build-test:
    name: iOS build + test
    runs-on: macos-15
    needs: data-contracts
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # README requires Xcode 26+; SemVer prefix picks the latest installed 26.x.
          xcode-version: '26'
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-
      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -sL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo ./xcodegen/install.sh
          xcodegen --version
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      # The destination is DISCOVERED, not named. It used to be pinned to
      # `name=iPhone 16`, which does not exist on the Xcode 26.x runners this job selects
      # (they ship iPhone 17 / iPad Pro 13-inch M5), so every run would have failed on
      # "Unable to find a destination" — a red build that says nothing about the code, and the
      # slowest possible way to learn that a model name rotted. Any hardcoded model rots the
      # same way on the next Xcode bump, so this picks the newest available iPhone runtime
      # instead: `simctl list -j` is the runner's own inventory, and `available == true`
      # excludes simulators whose runtime is not installed. Keep this resolution step if you
      # change the build command — reintroducing a literal model name reintroduces the defect.
      - name: Resolve a simulator destination
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list -j devices available > /tmp/simctl-devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys

          devices = json.load(open('/tmp/simctl-devices.json'))['devices']

          def ios_version(runtime_key):
            # Keys look like com.apple.CoreSimulator.SimRuntime.iOS-26-0. Compared as a tuple of
            # ints so iOS-9 does not sort above iOS-26 the way a string compare would.
            parts = runtime_key.rsplit('.', 1)[-1].split('-')[1:]
            return tuple(int(p) for p in parts if p.isdigit())

          newest = None
          for runtime, entries in devices.items():
            if '.iOS-' not in runtime:
              continue
            # `simctl list available` already filters unavailable runtimes; isAvailable is checked
            # anyway so a partially-installed runtime cannot be selected and fail at launch.
            iphones = [d for d in entries if d.get('isAvailable') and d['name'].startswith('iPhone')]
            if not iphones:
              continue
            candidate = (ios_version(runtime), iphones[0])
            if newest is None or candidate[0] > newest[0]:
              newest = candidate

          if newest is None:
            sys.exit('::error::No available iPhone simulator on this runner')

          version, device = newest
          # stdout is the step's output file; the human-readable line goes to stderr so it lands in
          # the log without being parsed as another output key.
          print(f"Selected simulator: {device['name']} on iOS {'.'.join(str(p) for p in version)} "
                f"({device['udid']})", file=sys.stderr)
          print(f"udid={device['udid']}")
          PY
      - name: Build & test
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project BADAN.xcodeproj -scheme BADAN \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            test | xcpretty
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          retention-days: 5

  android-build-test:
    name: Android build + test
    runs-on: ubuntu-latest
    needs: data-contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon
      # ADR-0011 / D-37 boundary check. "BADAN has no INTERNET permission" has only ever been
      # asserted by reading the SOURCE manifest (apps/android/app/src/main/AndroidManifest.xml,
      # which carries a comment noting the permission is deliberately absent) — but GMS, Play
      # Billing and Play Integrity all merge their OWN permissions into the final MERGED
      # manifest, and nothing has ever checked that merged output. Meanwhile
      # docs/PRIVACY_POLICY.md and docs/legal/privacy.html both state, in the present tense, that
      # BADAN transmits nothing off-device. If a dependency silently merged in INTERNET, those
      # documents would be false and nothing would say so.
      #
      # Android WILL legitimately gain INTERNET later — D-22 (AI coach), D-37 (telemetry), and
      # the REST export destination all need it (see
      # apps/android/app/src/main/java/net/albayyan/badan/export/destinations/
      # RestDestinationAvailability.kt:14, which already names manifest INTERNET as one of four
      # things that must move together before that deliverer ships). So this is an ALLOWLIST with
      # a paper trail, not a permanent ban — it just starts empty, because none of those three
      # things have landed on Android yet.
      #
      # :app:processReleaseMainManifest is the AGP 8.9.1 task that produces the merged manifest
      # (confirmed via the AGP task graph naming — process<Variant>MainManifest — the modern
      # replacement for the older process<Variant>Manifest task name; this could not be verified
      # against a live `./gradlew :app:tasks --all` locally because sibling Android-port tasks
      # held the Gradle config-cache lock at the time this step was written, so re-verify if this
      # step ever reports "could not locate the merged manifest output" below). The exact output
      # path under app/build/ has moved between AGP versions, so it is DISCOVERED with `find`
      # rather than hardcoded.
      #
      # Runnable locally exactly as written: cd apps/android && ./gradlew :app:processReleaseMainManifest
      # then grep the discovered merged_manifest/release/.../AndroidManifest.xml.
      - name: Merged manifest carries no un-allowlisted android.permission.INTERNET (ADR-0011 / D-37)
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew :app:processReleaseMainManifest --no-daemon
          MERGED="$(find app/build -type f -path '*merged_manifest*release*AndroidManifest.xml' | head -n1)"
          if [ -z "$MERGED" ]; then
            echo "::error::could not locate a merged manifest under app/build after :app:processReleaseMainManifest — the task name or its output path may have moved with the AGP version. Re-verify against 'gradlew :app:tasks --all' and update this step."
            exit 1
          fi
          echo "merged manifest: $MERGED"

          # Reasons INTERNET is permitted in the merged manifest, one per array entry. EMPTY
          # today. When D-22, D-37, or the REST export destination legitimately add it, add a
          # citation here (e.g. "D-22 AI coach — ADR-0010") AND add the explicit
          # <uses-permission android:name="android.permission.INTERNET" /> to the SOURCE manifest
          # AND update docs/PRIVACY_POLICY.md / docs/legal/privacy.html in the same change — see
          # RestDestinationAvailability.kt's own KDoc for why all of these move together.
          INTERNET_ALLOWLIST=()

          if grep -q 'android.permission.INTERNET' "$MERGED"; then
            if [ "${#INTERNET_ALLOWLIST[@]}" -eq 0 ]; then
              echo "::error::merged manifest ($MERGED) carries android.permission.INTERNET and the allowlist is empty. docs/PRIVACY_POLICY.md and docs/legal/privacy.html assert, in the present tense, that BADAN transmits nothing off-device — an un-allowlisted INTERNET permission in the merged manifest contradicts that claim. If this is a genuine, intended addition, add a justified entry to INTERNET_ALLOWLIST in this step AND update the privacy copy AND the source manifest in the same change."
              exit 1
            fi
            echo "android.permission.INTERNET present in merged manifest, allowlisted: ${INTERNET_ALLOWLIST[*]}"
          else
            echo "merged manifest carries no android.permission.INTERNET (expected — source manifest deliberately omits it)"
          fi
      - name: Lint (non-blocking)
        # Pre-existing lint errors in app resources are outside this job's scope to fix;
        # this step surfaces new issues without failing the build until they're cleaned up.
        working-directory: apps/android
        continue-on-error: true
        run: ./gradlew :app:lint --no-daemon

  # ADR-0011 / D-37. backend/api has had a pytest suite since App Attest landed and NOTHING ran it.
  # Adding a route to that service without running its tests is not acceptable, and the suite
  # includes the G8 assertion that no request body reaches the log — a property worth a gate.
  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.13, not latest: the pinned pydantic 2.9.2 has no prebuilt wheel for 3.14 and building
          # pydantic-core from source fails. The pin is deliberate (see requirements.txt), so the
          # runtime moves to match it rather than the other way round.
          python-version: '3.13'
      - name: Install dependencies
        working-directory: backend/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: backend/api
        run: python -m pytest tests/ -v

  reachability-ratchet:
    name: SwiftUI screen reachability ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pure text scan over apps/ios/App + apps/ios/Sources — no Xcode/simulator needed, so this
      # runs on ubuntu-latest independently of ios-build-test. Adapted from
      # ghawazi/scripts/check-reachability.py (see that script's docstring for the incident that
      # motivated it); BADAN has no equivalent finding yet, so this is added proactively as a
      # ratchet. See scripts/check-reachability.py's own docstring for what it checks and its limits.
      - name: Every top-level SwiftUI View is constructed somewhere outside its own #Preview
        run: python3 scripts/check-reachability.py
