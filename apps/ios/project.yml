name: BADAN
options:
  bundleIdPrefix: net.binjamshid.badan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BADAN:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes: ["**/.impeccable/**"]
      - path: Sources
        excludes: ["**/.impeccable/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.binjamshid.badan
        GENERATE_INFOPLIST_FILE: NO
        # Automatic signing. Simulator/CI builds need no team; device/archive builds require
        # DEVELOPMENT_TEAM — supply it on the archive command line (see docs/TESTFLIGHT.md)
        # or set it here, e.g. DEVELOPMENT_TEAM: ABCDE12345.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "54T3MDUR7H"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FEAT-01: HealthKitAdapter now performs real reads (previously linked but unused), so
        # the capability + entitlement are wired for real rather than left unset (COMP-01/02).
        CODE_SIGN_ENTITLEMENTS: App/BADAN.entitlements
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "NoorMono NoorQalam Mizan Hilal"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BADAN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Standard crypto only (HTTPS, SHA-256 checksums) — exempt from export compliance.
        # Avoids the manual encryption question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # COMP-08: names exactly what's read (sleep, heart rate, resting heart rate, steps) and
        # the on-device benefit, rather than a generic "your health data" description.
        NSHealthShareUsageDescription: "BADAN reads your sleep, heart rate, resting heart rate, and step data on your device to build your personal, private health repository. Nothing leaves your phone."
        # COMP-10: NSHealthUpdateUsageDescription removed — HealthKitAdapter requests read-only
        # access (`toShare: []`); a write-usage string with no write path was misleading.

  BADANTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: BADAN
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.binjamshid.badan.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  BADAN:
    build:
      targets:
        BADAN: all
        BADANTests: [test]
    test:
      targets:
        - BADANTests
      gatherCoverageData: false
