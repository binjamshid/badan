name: BADAN
options:
  bundleIdPrefix: net.binjamshid.badan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BADAN:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes: ["**/.impeccable/**"]
      - path: Sources
        excludes: ["**/.impeccable/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.binjamshid.badan
        GENERATE_INFOPLIST_FILE: NO
        # Automatic signing. Simulator/CI builds need no team; device/archive builds require
        # DEVELOPMENT_TEAM — supply it on the archive command line (see docs/TESTFLIGHT.md)
        # or set it here, e.g. DEVELOPMENT_TEAM: ABCDE12345.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "54T3MDUR7H"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FEAT-01: HealthKitAdapter now performs real reads (previously linked but unused), so
        # the capability + entitlement are wired for real rather than left unset (COMP-01/02).
        CODE_SIGN_ENTITLEMENTS: App/BADAN.entitlements
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "NoorMono NoorQalam Mizan Hilal"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      # EPIC-33 (Phase 3D). Embeds the widget extension into the app bundle so it ships and
      # installs alongside BADAN — without this the extension target builds but nothing ever
      # copies it into BADAN.app/PlugIns, and no widget would ever appear in the widget gallery.
      - target: BadanWidgets
        embed: true
    # `App/Info.plist` is GENERATED from this block on every `xcodegen generate` and is
    # gitignored for exactly that reason — editing the plist directly works until the next
    # generate silently reverts it. This block is the only authoritative copy. The same is
    # NOT true of App/BADAN.entitlements or App/PrivacyInfo.xcprivacy: those are hand-written,
    # tracked files that xcodegen only references.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BADAN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, ar]
        # FIX-4 (Phase 3D audit): registers the `badan://` scheme the four EPIC-33 widgets open
        # (`WidgetDeepLinkToken.url` in `apps/ios/BadanWidgets/BadanWidgetsBundle.swift`) —
        # `badan://deeplink/<token>`, handled by `BADANApp.swift`'s `.onOpenURL` via
        # `AppEnvironment.handleDeepLinkURL(_:)`. EPIC-33's own definition of done names deep-link
        # resolution as part of this wave, not a deferred item.
        CFBundleURLTypes:
          - CFBundleURLName: net.binjamshid.badan.deeplink
            CFBundleURLSchemes: [badan]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Standard crypto only (HTTPS, SHA-256 checksums) — exempt from export compliance.
        # Avoids the manual encryption question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # A2 (ADR-0009). The two BGTaskScheduler identifiers BADAN registers. `register(
        # forTaskWithIdentifier:)` raises if the identifier is absent here, so this list and the
        # registration call sites are one unit — adding a task type means editing both.
        #   .refresh    → BGAppRefreshTask:  light top-up (stale anchors, due automations).
        #   .processing → BGProcessingTask:  heavy work (large exports, historical backfills).
        # These read `net.albayyan.*` while PRODUCT_BUNDLE_IDENTIFIER is `net.binjamshid.badan`.
        # That is intentional and it works — BGTaskScheduler does not require identifiers to
        # share the bundle-id prefix — and the strings are fixed by ADR-0009, which EPIC-05's
        # registration code is written against. Do not "correct" them to match the bundle id
        # without amending the ADR; a rename here that misses a call site fails at runtime.
        BGTaskSchedulerPermittedIdentifiers:
          - net.albayyan.badan.refresh
          - net.albayyan.badan.processing
        # BUG-BG-01. `BGTaskSchedulerPermittedIdentifiers` shipped without this key, and the two
        # are not interchangeable: the identifier list is what lets `register(
        # forTaskWithIdentifier:)` succeed, while UIBackgroundModes is what lets
        # `BGTaskScheduler.submit(_:)` succeed. Without it every submit throws
        # `BGTaskSchedulerError.unavailable` on device — registration still succeeds, the launch
        # handlers are simply never invoked, and `background_runs` fills with `hkObserverWake`
        # and `foregroundSync` rows only. Nothing else in the app can detect that.
        #   fetch      → required for BGAppRefreshTaskRequest  (.refresh, above)
        #   processing → required for BGProcessingTaskRequest  (.processing, above)
        # One entry per task class, and the mapping is asserted by
        # `BackgroundSubstrateTests.testEveryPermittedTaskIdentifierHasItsBackgroundMode` so a
        # third task type cannot be added here without its mode. Do not trim either mode to
        # "narrow the review surface" — the entitlements file explains why HealthKit background
        # delivery needs no background mode and why that reasoning does not extend to these.
        UIBackgroundModes:
          - fetch
          - processing
        # COMP-08: names exactly what's read and the on-device benefit, rather than a generic
        # "your health data" description. Widened alongside A2's read-set expansion — the string
        # is contractually tied to `HealthKitAdapter.readTypes`: a type present here but never
        # requested overstates the ask, and a type requested but missing here is an App Store
        # rejection. Changing that set means changing this line AND both InfoPlist.strings
        # (en+ar) in the same commit; all three are checked together at review.
        # Routes are deliberately absent — they are not in the initial authorization bundle and
        # get their own consent screen (plan §13.1/§17), so naming them here would ask for
        # something the first prompt does not request.
        NSHealthShareUsageDescription: "BADAN reads your sleep, heart rate, resting heart rate, heart rate variability, breathing rate, blood oxygen, wrist temperature, steps, distance, flights climbed, energy burned, cardio fitness, body measurements, and workouts on your device to build your personal, private health repository. Nothing leaves your phone."
        # COMP-10: NSHealthUpdateUsageDescription removed — HealthKitAdapter requests read-only
        # access (`toShare: []`); a write-usage string with no write path was misleading. The
        # read-only posture survives the A2 widening: nothing in Phases 0–4 writes to HealthKit,
        # so do not reintroduce this key to "round out" the pairing.
        #
        # Workout routes only. Present so the route-consent screen (plan §13.1, gated behind its
        # own toggle) has honest copy when it needs CoreLocation — reading back a path the user's
        # own watch or phone already recorded, never sampling a new position. BADAN starts no
        # CLLocationManager for tracking. Note that the HealthKit route read itself is authorized
        # by `HKSeriesType.workoutRoute()`, not by this key; if the shipped route implementation
        # turns out to touch no CoreLocation-facing surface at all, delete this key rather than
        # carrying an unused location declaration into review.
        NSLocationWhenInUseUsageDescription: "BADAN uses location access only to read the routes your Apple Watch or iPhone already saved with workouts you finished earlier. BADAN never follows where you are and never records a new route. Nothing leaves your phone."

  # EPIC-33 (Phase 3D), first widget wave: ring_single (Readiness), one_true_sentence, meds_due,
  # sleep_last_night — home-screen + Lock Screen/StandBy accessory families. Reads ONLY the
  # bounded AmbientSnapshotDto from the app-group container (Sources/Platform/Ambient/); this
  # target has no dependency on the BADAN target's sources and must never gain one — extension
  # memory limits and key-availability-before-first-unlock are why the snapshot pattern exists at
  # all (blueprint §24.1). WidgetKit extensions are `app-extension`, not a plain framework/bundle.
  BadanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BadanWidgets
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.binjamshid.badan.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "54T3MDUR7H"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: BadanWidgets/BadanWidgets.entitlements
        # Widget extensions ship no app icon of their own — they render inside the host's chrome
        # (widget gallery, Lock Screen, StandBy) rather than launching as a standalone app.
        SKIP_INSTALL: NO
    info:
      path: BadanWidgets/Info.plist
      properties:
        CFBundleDisplayName: BadanWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BADANTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: BADAN
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.binjamshid.badan.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  BADAN:
    build:
      targets:
        BADAN: all
        BADANTests: [test]
    test:
      targets:
        - BADANTests
      gatherCoverageData: false
