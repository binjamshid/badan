# badan-api — AI coach backend (A9 / ADR-0010). Isolated vhost: proxies only
# to 127.0.0.1:8010 (badan-api.service), touches no other service on this host.
#
# `limit_req_zone` directives live at this top level (outside the `server {}` blocks below)
# because this whole file is pulled into nginx.conf's `http {}` context via
# `include /etc/nginx/sites-enabled/*;` — `limit_req_zone` is only valid in `http` context, so
# it cannot sit inside `server {}` itself. Two independent-purpose zones, keyed by client IP
# (`$binary_remote_addr`, the compact form `limit_req_zone` expects):
#   - `badan_register`: defense-in-depth in front of `backend/api/main.py`'s own
#     `register_rate_limiter`/`global_register_rate_limiter` (independent audit finding,
#     2026-07-23 — `/v1/register` previously had no abuse control at any layer, defeating
#     `/v1/chat`'s per-token limiter in aggregate since minting a fresh token was free).
#   - `badan_chat`: a coarser outer bound in front of the app's own per-token
#     `chat_rate_limiter`, so a caller cycling through many registered tokens from one IP still
#     hits a ceiling here even though each individual token stays under its own cap.
limit_req_zone $binary_remote_addr zone=badan_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=badan_chat:10m rate=60r/m;

# Plain-HTTP listener: redirect to HTTPS rather than serve the API in the clear. `/health` stays
# reachable over plain HTTP too (nothing sensitive in it) so a bare curl/uptime-check against
# port 80 doesn't need to speak TLS, but every `/v1/` call is forced onto 443.
server {
    listen 80;
    server_name badan.binjamshid.com;

    location /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }

    # ToS (eula.html) + Privacy Policy + Support, for the App Store Connect App
    # Privacy / Support URL / EULA fields. Static, read-only, no proxy — served over
    # plain HTTP too (nothing sensitive in a legal document) so App Review's fetch
    # never depends on the TLS cert landing first.
    location ~ ^/(privacy|eula|support)\.html$ {
        root /srv/badan/legal;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name badan.binjamshid.com;

    # D-22 (docs/DECISIONS.md) and ADR-0010 both commit to "own TLS cert" for this vhost, and
    # `AICoachClient.baseURLString` (apps/ios/Sources/Platform/AICoach/AICoachClient.swift)
    # hardcodes `https://badan.binjamshid.com` — this block is what makes that URL actually
    # reachable rather than connection-refused. Standard certbot `--nginx` layout; certbot
    # rewrites/renews these two paths in place.
    ssl_certificate /etc/letsencrypt/live/badan.binjamshid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badan.binjamshid.com/privkey.pem;

    # Bounds request-body size well below `ChatRequest`'s own Pydantic bound (40 messages ×
    # 4000 chars ≈ 160 KB plus JSON overhead) rather than relying on nginx's 1 MB default —
    # independent audit finding, 2026-07-23 — so an oversized body is rejected at the proxy
    # before it ever reaches the app process.
    client_max_body_size 256k;

    location /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }

    location ~ ^/(privacy|eula|support)\.html$ {
        root /srv/badan/legal;
    }

    # Exact match so this doesn't also swallow `/v1/revoke`/other future `/v1/*` routes — those
    # fall through to the general `/v1/` location below, which carries the coarser chat-oriented
    # limit instead of this endpoint's tighter one.
    location = /v1/register {
        limit_req zone=badan_register burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010/v1/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    location /v1/ {
        limit_req zone=badan_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    location / {
        return 404;
    }
}
