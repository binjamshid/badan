# badan-api - AI coach backend (A9 / ADR-0010) + the static ToS/Privacy/Support pages
# App Store Connect points at. Isolated vhost: proxies only to 127.0.0.1:8010
# (badan-api.service), touches no other service on this host.
#
# 2026-07-28: badan.binjamshid.com works end to end through Cloudflare. It had been broken since
# 2026-07-23 and was misdiagnosed twice; the real cause was THREE independent faults, all of which
# had to be fixed:
#
#   1. EDGE. A Worker route `*.binjamshid.com/*` -> script `assistant` matched this hostname and
#      answered every request at the edge, so nothing ever reached this origin (the tell: 404s with
#      no `cf-cache-status` header at all). Fixed by adding a more-specific Cloudflare Worker route
#      `badan.binjamshid.com/*` bound to NO script. The wildcard route is untouched and still
#      serves albayyan/ghawazi/mahdhar/makhtoot/masoon, none of which reach this box either.
#      NB the earlier "the DNS record must be missing" theory was wrong - the A record existed all
#      along; the Worker simply ran before the origin was ever consulted.
#
#   2. ORIGIN PORT. The zone's SSL mode is Full, so Cloudflare connects to the origin on 443 - and
#      this vhost listened only on 80. With no matching 443 block, nginx fell through to the first
#      443 server it loads (sites-enabled/albayyan, alphabetically) and served the Albayyan SPA.
#      Fixed by the 443 block at the bottom of this file, which mirrors the :80 block's locations.
#
#   3. ORIGIN CERT. With a self-signed cert - and then even with a Cloudflare Origin CA cert -
#      Cloudflare still returned 525 (handshake failed) and nothing reached nginx. The zone has
#      Automatic SSL/TLS enabled (`ssl_automatic_mode: auto`), which probes origins and had cached
#      a failed verdict for this hostname from when it had no 443 listener at all. A publicly
#      trusted certificate is what finally satisfied it. Fixed with a real Let's Encrypt cert
#      (certbot, auto-renewing) - which also means this hostname would survive a move to
#      Full (strict), unlike study.albayyan.net's block.
#
# A Cloudflare Configuration Rule also pins `ssl: full` for http.host eq badan.binjamshid.com, as
# insurance against Automatic SSL/TLS re-deciding. Deliberately scoped to this one hostname so it
# can never affect mail or the other services on this zone.
#
# Superseded files left in place at /etc/nginx/ssl-badan/ (self-signed badan.crt/key, and the
# Cloudflare Origin CA origin.crt/key). Both unused now; kept because the Origin CA pair is a valid
# fallback if this host ever needs to work without a public cert.
#
# The :80 block is kept, not replaced: certbot uses it to answer HTTP-01 renewal challenges.
limit_req_zone $binary_remote_addr zone=badan_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=badan_chat:10m rate=60r/m;

server {
    listen 80;
    server_name badan.binjamshid.com;

    client_max_body_size 256k;

    location /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }

    location = /v1/register {
        limit_req zone=badan_register burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010/v1/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    location /v1/ {
        limit_req zone=badan_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    # ToS (eula.html) + Privacy Policy + Support, for the App Store Connect
    # App Privacy / Support URL / EULA fields. Static, read-only, no proxy.
    location ~ ^/(privacy|eula|support)\.html$ {
        root /srv/badan/legal;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/badan.binjamshid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badan.binjamshid.com/privkey.pem;
    server_name badan.binjamshid.com;

    client_max_body_size 256k;

    location /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }

    location = /v1/register {
        limit_req zone=badan_register burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010/v1/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    location /v1/ {
        limit_req zone=badan_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    # ToS (eula.html) + Privacy Policy + Support, for the App Store Connect
    # App Privacy / Support URL / EULA fields. Static, read-only, no proxy.
    location ~ ^/(privacy|eula|support)\.html$ {
        root /srv/badan/legal;
    }

    location / {
        return 404;
    }
}
